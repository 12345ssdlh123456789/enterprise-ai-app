  name: enterprise-ai-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/enterprise-ai/enterprise-ai-app
    targetRevision: main
    path: infra/k8s/overlays/dev
    kustomize:
      version: v5.0.0
  destination:
