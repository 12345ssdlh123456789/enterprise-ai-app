apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enterprise-ai
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/enterprise-ai/enterprise-ai-app
    targetRevision: main
    path: infra/k8s/overlays/prod
    kustomize:
      version: v5.0.0
  destination:
    server: https://kubernetes.default.svc
    namespace: enterprise-ai-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
  info:
    - name: "Repository"
      value: "https://github.com/enterprise-ai/enterprise-ai-app"
    - name: "Environment"
      value: "Production"
    - name: "Chart"
      value: "infra/k8s/overlays/prod"
---
