apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-ai-config
  namespace: enterprise-ai
data:
  APP_ENV: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/enterprise_ai"
  REDIS_URL: "redis://redis:6379/0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
  # 启动建表走 Alembic 迁移（false 时退回 create_all）
  DB_AUTO_MIGRATE: "true"
  # 网关转发目标：集群内服务名 + 各服务真实监听端口
  AUTH_SERVICE_URL: "http://auth-service:8007"
  DOCUMENT_SERVICE_URL: "http://document-service:8004"
  RAG_SERVICE_URL: "http://rag-service:8001"
  LLM_SERVICE_URL: "http://llm-service:8003"
  WORKFLOW_SERVICE_URL: "http://workflow-service:8005"
---
apiVersion: v1
kind: Secret
metadata:
  name: enterprise-ai-secrets
  namespace: enterprise-ai
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_MIN_32_CHARS"
  # 网关与微服务共用的内部签名密钥；留空 = 不校验签名（仅限本地）
  SERVICE_API_KEY: "CHANGE_ME_INTERNAL_SERVICE_KEY"
  OPENAI_API_KEY: "sk-your-openai-key"
  ANTHROPIC_API_KEY: "sk-ant-your-anthropic-key"
  COHERE_API_KEY: "your-cohere-key"
  POSTGRES_PASSWORD: "secure-postgres-password"
  REDIS_PASSWORD: "secure-redis-password"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "secure-minio-password"