apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "enterprise-ai.fullname" . }}-admin
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "enterprise-ai.labels" . | nindent 4 }}
    app: admin
spec:
  replicas: {{ .Values.services.admin.replicas }}
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.services.admin.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "enterprise-ai.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: admin
          image: {{ .Values.services.admin.image }}:{{ .Values.services.admin.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.services.admin.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "enterprise-ai.fullname" . }}-config
            - secretRef:
                name: {{ include "enterprise-ai.fullname" . }}-secrets
          env:
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.services.admin.env.NEXT_PUBLIC_API_URL | quote }}
          resources:
            {{- toYaml .Values.services.admin.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.services.admin.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.services.admin.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - admin
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "enterprise-ai.fullname" . }}-admin
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "enterprise-ai.labels" . | nindent 4 }}
    app: admin
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.admin.port }}
      targetPort: {{ .Values.services.admin.port }}
      protocol: TCP
      name: http
  selector:
    app: admin
---
{{- if .Values.services.admin.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "enterprise-ai.fullname" . }}-admin-hpa
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "enterprise-ai.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "enterprise-ai.fullname" . }}-admin
  minReplicas: {{ .Values.services.admin.hpa.minReplicas }}
  maxReplicas: {{ .Values.services.admin.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.admin.hpa.targetCPUUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.admin.hpa.targetMemoryUtilization }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
{{- end }}