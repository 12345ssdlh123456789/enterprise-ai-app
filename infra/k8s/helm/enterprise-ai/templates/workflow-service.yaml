apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "enterprise-ai.fullname" . }}-workflow-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "enterprise-ai.labels" . | nindent 4 }}
    app: workflow-service
spec:
  replicas: {{ .Values.services.workflowService.replicas }}
  selector:
    matchLabels:
      app: workflow-service
  template:
    metadata:
      labels:
        app: workflow-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "enterprise-ai.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: workflow-service
          image: {{ .Values.services.workflowService.image }}:{{ .Values.services.workflowService.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.services.workflowService.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "enterprise-ai.fullname" . }}-config
            - secretRef:
                name: {{ include "enterprise-ai.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.services.workflowService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.workflowService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.services.workflowService.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - workflow-service
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "enterprise-ai.fullname" . }}-workflow-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "enterprise-ai.labels" . | nindent 4 }}
    app: workflow-service
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.workflowService.port }}
      targetPort: {{ .Values.services.workflowService.port }}
      protocol: TCP
      name: http
  selector:
    app: workflow-service
---
{{- if .Values.services.workflowService.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "enterprise-ai.fullname" . }}-workflow-service-hpa
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "enterprise-ai.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "enterprise-ai.fullname" . }}-workflow-service
  minReplicas: {{ .Values.services.workflowService.hpa.minReplicas }}
  maxReplicas: {{ .Values.services.workflowService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.workflowService.hpa.targetCPUUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.workflowService.hpa.targetMemoryUtilization }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
{{- end }}