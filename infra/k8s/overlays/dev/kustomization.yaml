apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: dev

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-gateway
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: api-gateway
                resources:
                  requests:
                    cpu: "100m"
                    memory: "256Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"
    target:
      kind: Deployment
      name: api-gateway
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rag-service
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: rag-service
                resources:
                  requests:
                    cpu: "250m"
                    memory: "512Mi"
                  limits:
                    cpu: "1000m"
                    memory: "2Gi"
    target:
      kind: Deployment
      name: rag-service

images:
  - name: enterprise-ai/api-gateway
    newTag: dev-latest
  - name: enterprise-ai/auth-service
    newTag: dev-latest
  - name: enterprise-ai/notification-service
    newTag: dev-latest
  - name: enterprise-ai/rag-service
    newTag: dev-latest
  - name: enterprise-ai/llm-service
    newTag: dev-latest
  - name: enterprise-ai/document-service
    newTag: dev-latest
  - name: enterprise-ai/workflow-service
    newTag: dev-latest
  - name: enterprise-ai/web
    newTag: dev-latest
  - name: enterprise-ai/admin
    newTag: dev-latest

configMapGenerator:
  - name: enterprise-ai-config
    namespace: enterprise-ai
    behavior: merge
    literals:
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/enterprise_ai
      - REDIS_URL=redis://redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317