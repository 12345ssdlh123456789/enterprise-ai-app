[alembic]
script_location = alembic
prepend_sys_path = .
# NOTE: alembic reads this file with the system locale encoding (GBK on zh-CN Windows),
# so keep it ASCII-only. A bare '%' here made configparser raise
# InterpolationSyntaxError; the DB URL comes from alembic/env.py (settings.DATABASE_URL).
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
